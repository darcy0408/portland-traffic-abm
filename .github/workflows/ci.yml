# Continuous integration: run the ABM validation test-bench on every push.
#
# This is the automated version of "show me it works" (mentor request, Jun 24). On each
# push or pull request, GitHub installs the dependencies and runs src/scenarios.py,
# which exits non-zero if any scenario fails, so a change that breaks the IDM
# car-following or the signal/spillback logic turns the check red.
#
# Scope is deliberately small for a solo research prototype: the test-bench plus an
# import check. The saturation scenario skips itself here because the cached Powell
# network is gitignored (not on GitHub); the three controlled scenarios need no
# network and fully exercise the kernel.
#
# The import check (src/import_check.py) imports every src/*.py module and fails if
# a module-level import names a package pip did not install. Added after the Oct
# 2026 audit found the analysis scripts' dependencies (scikit-learn, scipy, shapely,
# geopandas, Pillow) missing from the file while CI stayed green. It checks only
# module-level imports: not call-time imports, not versions, and not whether any
# analysis script runs end to end.
name: CI

on:
  push:
  pull_request:

jobs:
  test-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that every src module imports with the declared dependencies
        run: python src/import_check.py

      - name: Run the validation test-bench
        run: python src/scenarios.py
